name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip (if present)
        run: |
          zipfile=$(ls *-project.zip 2>/dev/null | head -n 1)
          if [ -n "$zipfile" ]; then
            unzip -oq "$zipfile" -d /tmp/unzipped
            innerdir=$(ls /tmp/unzipped | head -n 1)
            cp -rf "/tmp/unzipped/$innerdir/." .
          fi

      - name: Generate debug keystore (none is bundled with the AI Studio export)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: current

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: magasinpharma-debug-apk
          path: app/build/outputs/apk/debug/*.apk
