name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean workspace and unpack project zip
        run: |
          zipfile="MagasinPharma-project.zip"
          if [ ! -f "$zipfile" ]; then
            zipfile=$(ls *-project.zip 2>/dev/null | head -n 1)
          fi
          if [ -z "$zipfile" ]; then
            echo "No project zip found in repo root"
            exit 1
          fi
          echo "Building from: $zipfile"
          cp "$zipfile" /tmp/project.zip
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          unzip -oq /tmp/project.zip -d /tmp/unzipped
          innerdir=$(ls /tmp/unzipped | head -n 1)
          cp -rf "/tmp/unzipped/$innerdir/." .

